name: MacSentry
options:
  bundleIdPrefix: dev.macsentry
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: LN2CFAG956
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ARCHS: arm64
packages:
  MacSentryCore:
    path: Packages/MacSentryCore
targets:
  MacSentry:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: MacSentryCore
        product: MacSentryCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.macsentry.app
        PRODUCT_NAME: MacSentry
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MacSentry
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_IDENTITY: Apple Development
  MacSentryTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
    dependencies:
      - target: MacSentry
      - package: MacSentryCore
        product: MacSentryTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.macsentry.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/MacSentry.app/Contents/MacOS/MacSentry
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  MacSentry:
    build:
      targets:
        MacSentry: all
        MacSentryTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-MacSentryDryRun YES": true
        "-MacSentryScanRoot /tmp/macsentry-dev/root": true
        "-MacSentryDatabasePath /tmp/macsentry-dev/macsentry.sqlite": true
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MacSentryTests
      commandLineArguments:
        "-MacSentryDryRun YES": true
        "-MacSentryScanRoot /tmp/macsentry-tests/root": true
        "-MacSentryDatabasePath /tmp/macsentry-tests/macsentry.sqlite": true
