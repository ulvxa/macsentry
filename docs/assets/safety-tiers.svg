<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" font-family="-apple-system, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f1f21"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
<rect width="1600" height="470" rx="36" fill="url(#panel)"/><rect x="0.5" y="0.5" width="1599" height="469" rx="35.5" fill="none" stroke="#fff" stroke-opacity="0.12"/><text x="60" y="80" font-size="34" font-weight="700" fill="#fff" letter-spacing="-0.5">Safety tiers</text><text x="60" y="112" font-size="19" fill="#8e8e93">Told apart by shape and label, never by color.</text><rect x="50" y="145" width="355" height="285" rx="24" fill="#fff" fill-opacity="0.055" stroke="#fff" stroke-opacity="0.14"/><rect x="76" y="171" width="64" height="64" rx="18" fill="#fff" fill-opacity="0.09"/><g transform="translate(108 203)"><circle r="17" fill="none" stroke="#fff" stroke-width="3"/><path d="M-8 1 L-2 7 L9 -6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="158" y="213" font-size="30" font-weight="700" fill="#fff" letter-spacing="-0.5">Safe</text><text x="76" y="275" font-size="19.5" font-weight="600" fill="#f0f0f2">Regenerates automatically.</text><text x="76" y="305" font-size="17.5" fill="#b4b4b8">Zero effort to get back.</text><text x="76" y="330" font-size="17.5" fill="#b4b4b8">Preselected for quarantine.</text><rect x="76" y="368" width="124" height="36" rx="18" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.16"/><text x="138.0" y="392" font-size="15" font-weight="500" text-anchor="middle" fill="#d8d8da">Default: on</text><rect x="432" y="145" width="355" height="285" rx="24" fill="#fff" fill-opacity="0.055" stroke="#fff" stroke-opacity="0.14"/><rect x="458" y="171" width="64" height="64" rx="18" fill="#fff" fill-opacity="0.09"/><g transform="translate(490 203)"><circle r="17" fill="none" stroke="#fff" stroke-width="3"/><path d="M-8 -3 A9 9 0 0 1 7 -5 M8 3 A9 9 0 0 1 -7 5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M7 -10 V-4 H1 M-7 10 V4 H-1" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540" y="213" font-size="30" font-weight="700" fill="#fff" letter-spacing="-0.5">Rebuildable</text><text x="458" y="275" font-size="19.5" font-weight="600" fill="#f0f0f2">Costs time or bandwidth.</text><text x="458" y="305" font-size="17.5" fill="#b4b4b8">Reimport, redownload or rebuild</text><text x="458" y="330" font-size="17.5" fill="#b4b4b8">after it is gone.</text><rect x="458" y="368" width="132" height="36" rx="18" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.16"/><text x="524.0" y="392" font-size="15" font-weight="500" text-anchor="middle" fill="#d8d8da">Default: off</text><rect x="814" y="145" width="355" height="285" rx="24" fill="#fff" fill-opacity="0.055" stroke="#fff" stroke-opacity="0.14"/><rect x="840" y="171" width="64" height="64" rx="18" fill="#fff" fill-opacity="0.09"/><g transform="translate(872 203)"><path d="M-6.5 -18 H6.5 L18 -6.5 V6.5 L6.5 18 H-6.5 L-18 6.5 V-6.5 Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M0 -8 V3" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><circle cy="9.5" r="2" fill="#fff"/></g><text x="922" y="213" font-size="30" font-weight="700" fill="#fff" letter-spacing="-0.5">Careful</text><text x="840" y="275" font-size="19.5" font-weight="600" fill="#f0f0f2">Your data or hard to recover.</text><text x="840" y="305" font-size="17.5" fill="#b4b4b8">Review every item before</text><text x="840" y="330" font-size="17.5" fill="#b4b4b8">you move it.</text><rect x="840" y="368" width="132" height="36" rx="18" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.16"/><text x="906.0" y="392" font-size="15" font-weight="500" text-anchor="middle" fill="#d8d8da">Default: off</text><rect x="1196" y="145" width="355" height="285" rx="24" fill="#fff" fill-opacity="0.055" stroke="#fff" stroke-opacity="0.4" stroke-dasharray="7 6"/><rect x="1222" y="171" width="64" height="64" rx="18" fill="#fff" fill-opacity="0.09"/><g transform="translate(1254 203)"><path d="M-10 -16 V17" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M-10 -14 H12 L7 -6 L12 2 H-10" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g><text x="1304" y="213" font-size="30" font-weight="700" fill="#fff" letter-spacing="-0.5">Flagged</text><text x="1222" y="275" font-size="19.5" font-weight="600" fill="#f0f0f2">Never moved by MacSentry.</text><text x="1222" y="305" font-size="17.5" fill="#b4b4b8">Risky stores show a copyable</text><text x="1222" y="330" font-size="17.5" fill="#b4b4b8">CLI command instead.</text><rect x="1222" y="368" width="233" height="36" rx="18" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.16"/><text x="1338.5" y="392" font-size="15" font-weight="500" text-anchor="middle" fill="#d8d8da">Copy and run it yourself</text>
</svg>
