<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="590" viewBox="0 0 1600 590" font-family="-apple-system, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f1f21"/><stop offset="1" stop-color="#0b0b0c"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
<rect width="1600" height="590" rx="36" fill="url(#panel)"/><rect x="0.5" y="0.5" width="1599" height="589" rx="35.5" fill="none" stroke="#fff" stroke-opacity="0.12"/><text x="60" y="84" font-size="34" font-weight="700" fill="#fff" letter-spacing="-0.5">How it works</text><text x="60" y="116" font-size="19" fill="#8e8e93">Five steps. Every move is reversible until you empty the Trash.</text><rect x="50" y="150" width="260" height="310" rx="24" fill="#fff" fill-opacity="0.055" stroke="#fff" stroke-opacity="0.14" stroke-width="1"/><text x="76" y="188" font-size="16" font-weight="600" fill="#8e8e93" letter-spacing="1.5">STEP 1</text><rect x="76" y="210" width="64" height="64" rx="18" fill="#fff" fill-opacity="0.09"/><g transform="translate(108 242)"><circle cx="-3" cy="-3" r="12" fill="none" stroke="#fff" stroke-width="3"/><path d="M6 6 L16 16" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/></g><text x="76" y="320" font-size="30" font-weight="700" fill="#fff" letter-spacing="-0.5">Scan</text><text x="76" y="356" font-size="17" fill="#b4b4b8">Read-only walk of your</text><text x="76" y="380" font-size="17" fill="#b4b4b8">disk, matched against a</text><text x="76" y="404" font-size="17" fill="#b4b4b8">JSON rule catalog.</text><path d="M318 305.0 H348" stroke="#fff" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/><path d="M341 298.0 L349 305.0 L341 312.0" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="360" y="150" width="260" height="310" rx="24" fill="#fff" fill-opacity="0.055" stroke="#fff" stroke-opacity="0.14" stroke-width="1"/><text x="386" y="188" font-size="16" font-weight="600" fill="#8e8e93" letter-spacing="1.5">STEP 2</text><rect x="386" y="210" width="64" height="64" rx="18" fill="#fff" fill-opacity="0.09"/><g transform="translate(418 242)"><path d="M-16 -12 H16 M-16 0 H8 M-16 12 H0" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/><circle cx="14" cy="10" r="5" fill="none" stroke="#fff" stroke-width="3"/></g><text x="386" y="320" font-size="30" font-weight="700" fill="#fff" letter-spacing="-0.5">Classify</text><text x="386" y="356" font-size="17" fill="#b4b4b8">Each match gets a safety</text><text x="386" y="380" font-size="17" fill="#b4b4b8">tier: Safe, Rebuildable</text><text x="386" y="404" font-size="17" fill="#b4b4b8">or Careful. Risky stores</text><text x="386" y="428" font-size="17" fill="#b4b4b8">are flagged only.</text><path d="M628 305.0 H658" stroke="#fff" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/><path d="M651 298.0 L659 305.0 L651 312.0" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="670" y="150" width="260" height="310" rx="24" fill="#fff" fill-opacity="0.055" stroke="#fff" stroke-opacity="0.14" stroke-width="1"/><text x="696" y="188" font-size="16" font-weight="600" fill="#8e8e93" letter-spacing="1.5">STEP 3</text><rect x="696" y="210" width="64" height="64" rx="18" fill="#fff" fill-opacity="0.09"/><g transform="translate(728 242)"><path d="M-19 0 C-11 -13 11 -13 19 0 C11 13 -11 13 -19 0 Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><circle r="5.5" fill="none" stroke="#fff" stroke-width="3"/></g><text x="696" y="320" font-size="30" font-weight="700" fill="#fff" letter-spacing="-0.5">Review</text><text x="696" y="356" font-size="17" fill="#b4b4b8">You choose what goes.</text><text x="696" y="380" font-size="17" fill="#b4b4b8">Safe is preselected;</text><text x="696" y="404" font-size="17" fill="#b4b4b8">everything else is</text><text x="696" y="428" font-size="17" fill="#b4b4b8">opt-in.</text><path d="M938 305.0 H968" stroke="#fff" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/><path d="M961 298.0 L969 305.0 L961 312.0" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="980" y="150" width="260" height="310" rx="24" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.45" stroke-width="1.5"/><text x="1006" y="188" font-size="16" font-weight="600" fill="#8e8e93" letter-spacing="1.5">STEP 4</text><rect x="1006" y="210" width="64" height="64" rx="18" fill="#fff" fill-opacity="0.09"/><g transform="translate(1038 242)"><rect x="-17" y="-16" width="34" height="9" rx="2.5" fill="none" stroke="#fff" stroke-width="3"/><path d="M-14 -7 V15 a3 3 0 0 0 3 3 H11 a3 3 0 0 0 3 -3 V-7" fill="none" stroke="#fff" stroke-width="3"/><path d="M-6 3 H6" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><text x="1006" y="320" font-size="30" font-weight="700" fill="#fff" letter-spacing="-0.5">Quarantine</text><text x="1006" y="356" font-size="17" fill="#b4b4b8">ProtectionPolicy check,</text><text x="1006" y="380" font-size="17" fill="#b4b4b8">then an instant move on</text><text x="1006" y="404" font-size="17" fill="#b4b4b8">the same volume, into</text><text x="1006" y="428" font-size="17" fill="#b4b4b8">~/MacSentry Quarantine.</text><path d="M1248 305.0 H1278" stroke="#fff" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round"/><path d="M1271 298.0 L1279 305.0 L1271 312.0" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1290" y="150" width="260" height="310" rx="24" fill="#fff" fill-opacity="0.055" stroke="#fff" stroke-opacity="0.14" stroke-width="1"/><text x="1316" y="188" font-size="16" font-weight="600" fill="#8e8e93" letter-spacing="1.5">STEP 5</text><rect x="1316" y="210" width="64" height="64" rx="18" fill="#fff" fill-opacity="0.09"/><g transform="translate(1348 242)"><path d="M-17 -10 H17 M-6 -10 V-15 H6 V-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 -10 L-10 15 a3 3 0 0 0 3 3 H7 a3 3 0 0 0 3 -3 L12 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M-4 -2 V10 M4 -2 V10" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><text x="1316" y="320" font-size="30" font-weight="700" fill="#fff" letter-spacing="-0.5">Trash</text><text x="1316" y="356" font-size="17" fill="#b4b4b8">You move it to the macOS</text><text x="1316" y="380" font-size="17" fill="#b4b4b8">Trash from the UI.</text><text x="1316" y="404" font-size="17" fill="#b4b4b8">Restore anytime before</text><text x="1316" y="428" font-size="17" fill="#b4b4b8">that.</text><rect x="50" y="494" width="1500" height="64" rx="20" fill="#fff" fill-opacity="0.92"/><g transform="translate(94 526)"><path d="M0 -18 L16 -12 V3 C16 11 9 16 0 19 C-9 16 -16 11 -16 3 V-12 Z" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/><path d="M-6 1 L-1 6 L7 -4" fill="none" stroke="#111" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="130" y="534" font-size="24" font-weight="700" fill="#0b0b0c">Nothing is ever deleted directly.</text><text x="1520" y="533" font-size="19" text-anchor="end" fill="#3a3a3c">The only destructive call is the system Trash, and only you trigger it.</text>
</svg>
