name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Lint and Core tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: SwiftLint
        run: swiftlint --strict

      - name: Core tests
        run: swift test --package-path Packages/MacSentryCore
